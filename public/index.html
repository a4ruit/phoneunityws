<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0d0d10">
<title>IOL</title>
<style>
  :root { --bg:#0d0d10; --fg:#e8e6e1; --dim:#8a8a93; --line:#26262e; --accent:#4cc2ff; --good:#6bd88a; --bad:#ff6b5e; }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; height: 100%;
    background: var(--bg); color: var(--fg);
    font: 16px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    -webkit-user-select: none; user-select: none; overscroll-behavior: none;
  }
  main {
    min-height: 100%; max-width: 420px; margin: 0 auto;
    padding: max(24px, env(safe-area-inset-top)) 20px max(24px, env(safe-area-inset-bottom));
    display: flex; flex-direction: column; gap: 22px;
  }

  .arrow { font-size: 96px; line-height: 1; text-align: center; color: var(--accent);
           transition: transform .1s linear; }
  .deg { text-align: center; font-size: 34px; font-variant-numeric: tabular-nums; }
  .deg small { font-size: 16px; color: var(--dim); }

  label { display: block; font-size: 12px; letter-spacing: .12em; text-transform: uppercase;
          color: var(--dim); margin-bottom: 6px; }
  input, button {
    font: inherit; width: 100%; padding: 14px;
    border: 1px solid var(--line); border-radius: 10px;
    background: #16161b; color: var(--fg);
  }
  .row { display: flex; gap: 10px; }
  button { font-weight: 600; }
  button.primary { background: var(--accent); color: #041019; border-color: transparent; }
  button:disabled { opacity: .4; }

  .status { display: flex; justify-content: space-between; font-size: 13px; color: var(--dim);
            border-top: 1px solid var(--line); padding-top: 14px; }
  .status b { font-weight: 600; color: var(--fg); }
  .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%;
         background: var(--bad); margin-right: 6px; vertical-align: middle; }
  .dot.on { background: var(--good); }
  .hint { color: var(--dim); font-size: 12px; text-align: center; margin: 0; }
</style>
</head>
<body>
<main>
  <div class="arrow" id="arrow">&#9650;</div>
  <div class="deg"><span id="deg">---</span><small>&deg;</small></div>

  <div>
    <label for="room">Room</label>
    <input id="room" value="default" autocomplete="off" autocapitalize="off" spellcheck="false">
  </div>

  <div class="row">
    <button id="connect" class="primary">Connect</button>
    <button id="disconnect" disabled>Disconnect</button>
  </div>

  <div class="row">
    <button id="start" disabled>Start</button>
    <button id="stop" disabled>Stop</button>
  </div>

  <div class="status">
    <span><span class="dot" id="dot"></span><span id="state">offline</span></span>
    <span><b id="count">0</b> entities</span>
  </div>

  <p class="hint">Wear headphones. Hold the phone flat, top edge pointing the way you face.</p>
</main>

<script>
(() => {
  'use strict';

  const $ = (id) => document.getElementById(id);
  const els = {
    arrow: $('arrow'), deg: $('deg'), room: $('room'),
    connect: $('connect'), disconnect: $('disconnect'),
    start: $('start'), stop: $('stop'),
    dot: $('dot'), state: $('state'), count: $('count')
  };

  const SEND_HZ = 20;

  let socket = null;
  let wantConnection = false;
  let streaming = false;
  let heading = 0;
  let lastSent = 0;
  let timer = null;
  let retry = null;

  function setStatus(text, ok) {
    els.state.textContent = text;
    els.dot.classList.toggle('on', !!ok);
  }

  function setButtons() {
    const connected = socket && socket.readyState === WebSocket.OPEN;
    els.connect.disabled = wantConnection;
    els.disconnect.disabled = !wantConnection;
    els.room.disabled = wantConnection;
    els.start.disabled = !connected || streaming;
    els.stop.disabled = !streaming;
  }

  // ---------------------------------------------------------------- websocket

  function connect() {
    wantConnection = true;
    clearTimeout(retry);
    setStatus('connecting', false);
    setButtons();

    const proto = location.protocol === 'https:' ? 'wss:' : 'ws:';
    const room = encodeURIComponent(els.room.value.trim() || 'default');
    socket = new WebSocket(`${proto}//${location.host}/ws?room=${room}&role=phone`);

    socket.onopen = () => { setStatus('connected', true); setButtons(); };

    socket.onmessage = (ev) => {
      let msg;
      try { msg = JSON.parse(ev.data); } catch { return; }
      if (msg.type === 'entities') Audio.update(msg.items || []);
      else if (msg.type === 'cue') Audio.cue(msg.x, msg.z);
    };

    socket.onclose = () => {
      setStatus(wantConnection ? 'reconnecting' : 'offline', false);
      setButtons();
      if (wantConnection) retry = setTimeout(connect, 2000);
    };

    socket.onerror = () => setStatus('error', false);
  }

  function disconnect() {
    wantConnection = false;
    clearTimeout(retry);
    stopStreaming();
    if (socket) socket.close();
    socket = null;
    setStatus('offline', false);
    setButtons();
  }

  // -------------------------------------------------------------- orientation

  function screenAngle() {
    if (screen.orientation && typeof screen.orientation.angle === 'number') return screen.orientation.angle;
    return window.orientation || 0;
  }

  function onOrientation(e) {
    let h = null;
    if (typeof e.webkitCompassHeading === 'number' && !Number.isNaN(e.webkitCompassHeading)) {
      h = e.webkitCompassHeading;                  // iOS: true-north, clockwise
    } else if (typeof e.alpha === 'number') {
      h = 360 - e.alpha;                           // spec: alpha is counter-clockwise
    }
    if (h === null) return;

    heading = ((h + screenAngle()) % 360 + 360) % 360;
    els.deg.textContent = heading.toFixed(0).padStart(3, '0');
    els.arrow.style.transform = `rotate(${-heading}deg)`;
    Audio.setHeading(heading);
  }

  async function requestPermission() {
    const gated = typeof DeviceOrientationEvent !== 'undefined' &&
                  typeof DeviceOrientationEvent.requestPermission === 'function';
    if (!gated) return true;
    return (await DeviceOrientationEvent.requestPermission()) === 'granted';
  }

  // --------------------------------------------------------------- web audio
  // Unity streams entity positions; the phone renders them with HRTF panning so
  // turning on the spot pans immediately, with no round trip to the server.

  const Audio = (() => {
    let ctx = null;
    let master = null;
    const voices = new Map();     // id -> { osc, sub, gain, panner, filter }
    let lastPacket = 0;
    let detecting = false;        // true while entities are being received

    function start() {
      const Ctx = window.AudioContext || window.webkitAudioContext;
      ctx = new Ctx();
      master = ctx.createGain();
      master.gain.value = 0.9;

      const limiter = ctx.createDynamicsCompressor();
      limiter.threshold.value = -12;
      limiter.ratio.value = 12;

      master.connect(limiter).connect(ctx.destination);

      if (ctx.listener.forwardX) {
        ctx.listener.positionX.value = 0;
        ctx.listener.positionY.value = 0;
        ctx.listener.positionZ.value = 0;
        ctx.listener.upX.value = 0; ctx.listener.upY.value = 1; ctx.listener.upZ.value = 0;
      } else {
        ctx.listener.setPosition(0, 0, 0);
      }
      setHeading(heading);
      return ctx.resume();
    }

    function stop() {
      voices.forEach((v) => { try { v.osc.stop(); v.sub.stop(); } catch {} });
      voices.clear();
      if (ctx) ctx.close();
      ctx = null;
      detecting = false;
      els.count.textContent = '0';
    }

    // heading is clockwise from north. Unity sends north-referenced metres
    // (x = east, z = north), and Web Audio's -Z is forward, so north maps to -Z.
    function setHeading(deg) {
      if (!ctx) return;
      const rad = deg * Math.PI / 180;
      const fx = Math.sin(rad), fz = -Math.cos(rad);

      if (ctx.listener.forwardX) {
        const t = ctx.currentTime;
        ctx.listener.forwardX.setTargetAtTime(fx, t, 0.03);
        ctx.listener.forwardZ.setTargetAtTime(fz, t, 0.03);
        ctx.listener.forwardY.value = 0;
      } else {
        ctx.listener.setOrientation(fx, 0, fz, 0, 1, 0);
      }
    }

    function createVoice(pitch) {
      const panner = ctx.createPanner();
      panner.panningModel = 'HRTF';
      panner.distanceModel = 'inverse';
      panner.refDistance = 1.5;
      panner.maxDistance = 25;
      panner.rolloffFactor = 1.4;
      panner.connect(master);

      const gain = ctx.createGain();
      gain.gain.value = 0;
      gain.connect(panner);

      const filter = ctx.createBiquadFilter();
      filter.type = 'lowpass';
      filter.frequency.value = 900;
      filter.connect(gain);

      const base = 110 * (pitch || 1);
      const osc = ctx.createOscillator();
      osc.type = 'triangle';
      osc.frequency.value = base;
      osc.connect(filter);
      osc.start();

      const sub = ctx.createOscillator();
      sub.type = 'sine';
      sub.frequency.value = base * 1.5;
      const subGain = ctx.createGain();
      subGain.gain.value = 0.35;
      sub.connect(subGain).connect(filter);
      sub.start();

      return { osc, sub, gain, panner, filter };
    }

    // Short blip. With no position it goes straight to the destination and sits
    // centred; with one it is panned like an entity.
    function blip(freq = 880, seconds = 0.12, pos = null, level = 0.25) {
      if (!ctx) return;
      const t = ctx.currentTime;
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();

      osc.type = 'sine';
      osc.frequency.setValueAtTime(freq, t);

      gain.gain.setValueAtTime(0, t);
      gain.gain.linearRampToValueAtTime(level, t + 0.01);
      gain.gain.exponentialRampToValueAtTime(0.0001, t + seconds);

      let tail = gain;
      if (pos) {
        const panner = ctx.createPanner();
        panner.panningModel = 'HRTF';
        panner.distanceModel = 'inverse';
        panner.refDistance = 1.5;
        panner.maxDistance = 25;
        panner.rolloffFactor = 1.2;
        if (panner.positionX) {
          panner.positionX.value = pos.x;
          panner.positionY.value = 0;
          panner.positionZ.value = -pos.z;   // Unity north -> Web Audio -Z
        } else {
          panner.setPosition(pos.x, 0, -pos.z);
        }
        gain.connect(panner);
        tail = panner;
      }

      osc.connect(gain);
      tail.connect(pos ? master : ctx.destination);
      osc.start(t);
      osc.stop(t + seconds + 0.02);
    }

    // An entity crossed into the user's facing cone.
    function cue(x, z) {
      blip(1240, 0.18, { x, z }, 0.5);
    }

    function setPos(voice, x, z) {
      const t = ctx.currentTime;
      // Unity north -> Web Audio -Z.
      const wx = x, wz = -z;
      if (voice.panner.positionX) {
        voice.panner.positionX.setTargetAtTime(wx, t, 0.05);
        voice.panner.positionY.setTargetAtTime(0, t, 0.05);
        voice.panner.positionZ.setTargetAtTime(wz, t, 0.05);
      } else {
        voice.panner.setPosition(wx, 0, wz);
      }
    }

    function update(items) {
      if (!ctx) return;
      lastPacket = performance.now();
      els.count.textContent = items.length;

      // Two-tone chirp the moment the feed comes alive.
      if (items.length > 0 && !detecting) {
        detecting = true;
        blip(660, 0.1);
        setTimeout(() => blip(990, 0.14), 110);
      } else if (items.length === 0) {
        detecting = false;
      }

      const seen = new Set();
      const t = ctx.currentTime;

      for (const item of items) {
        seen.add(item.id);
        let voice = voices.get(item.id);
        if (!voice) {
          voice = createVoice(item.p);
          voices.set(item.id, voice);
        }
        setPos(voice, item.x, item.z);
        voice.gain.gain.setTargetAtTime(Math.max(0, Math.min(1, item.v)), t, 0.12);
      }

      // Retire voices for entities that vanished.
      for (const [id, voice] of voices) {
        if (seen.has(id)) continue;
        voice.gain.gain.setTargetAtTime(0, t, 0.1);
        setTimeout(() => { try { voice.osc.stop(); voice.sub.stop(); } catch {} }, 400);
        voices.delete(id);
      }
    }

    // Fade out if Unity stops sending.
    setInterval(() => {
      if (!ctx || performance.now() - lastPacket < 3000) return;
      const t = ctx.currentTime;
      voices.forEach((v) => v.gain.gain.setTargetAtTime(0, t, 0.3));
      els.count.textContent = '0';
      detecting = false;          // chirp again when the feed comes back
    }, 1000);

    return { start, stop, update, setHeading, cue };
  })();

  // ------------------------------------------------------------- send loop

  function pump() {
    if (!socket || socket.readyState !== WebSocket.OPEN) return;
    const now = performance.now();
    if (now - lastSent < 1000 / SEND_HZ) return;
    lastSent = now;
    socket.send(JSON.stringify({ type: 'heading', heading }));
  }

  async function startStreaming() {
    if (!(await requestPermission())) { setStatus('motion denied', false); return; }

    // Both the sensors and the AudioContext need this to run inside the tap.
    await Audio.start();

    window.addEventListener('deviceorientationabsolute', onOrientation, true);
    window.addEventListener('deviceorientation', onOrientation, true);
    timer = setInterval(pump, 1000 / SEND_HZ / 2);

    streaming = true;
    setStatus('streaming', true);
    setButtons();

    if ('wakeLock' in navigator) navigator.wakeLock.request('screen').catch(() => {});
  }

  function stopStreaming() {
    if (!streaming) return;
    window.removeEventListener('deviceorientationabsolute', onOrientation, true);
    window.removeEventListener('deviceorientation', onOrientation, true);
    clearInterval(timer);
    Audio.stop();
    streaming = false;
    setStatus(socket && socket.readyState === WebSocket.OPEN ? 'connected' : 'offline',
              socket && socket.readyState === WebSocket.OPEN);
    setButtons();
  }

  els.connect.addEventListener('click', connect);
  els.disconnect.addEventListener('click', disconnect);
  els.start.addEventListener('click', startStreaming);
  els.stop.addEventListener('click', stopStreaming);

  const saved = localStorage.getItem('iol.room');
  if (saved) els.room.value = saved;
  els.room.addEventListener('change', () => localStorage.setItem('iol.room', els.room.value.trim()));

  setButtons();
})();
</script>
</body>
</html>
